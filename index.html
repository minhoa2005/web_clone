<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Khám phá lịch sử Đảng Cộng sản Việt Nam qua các sự kiện, địa danh và trang giáo trình từ năm 1911 đến năm 2021." />
    <title>Lịch sử Đảng — Địa cầu lịch sử</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Archivo:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <body>
    <div id="root">
      <main class="atlas atlas--visited" aria-label="Địa cầu lịch sử Đảng Cộng sản Việt Nam">
        <div class="globe-host" aria-label="Địa cầu tương tác với các địa danh lịch sử"></div>
        <header class="head">
          <p class="head__title">lịch sử <em>Đảng</em></p>
        </header>
        <nav class="controls" aria-label="Điều khiển địa cầu">
          <div class="mode-toggle"><button class="mode-btn is-active">1911–1945</button><button class="mode-btn">1945–2021</button></div>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
